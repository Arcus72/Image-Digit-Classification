services:
  classificator:
    build: ./app
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - '7860:7860'
    develop:
      watch:
        - path: ./app/requirements.txt
          action: rebuild
        - path: ./app/pyproject.toml
          action: rebuild
        - path: ./app
          target: /app
          action: sync
          ignore:
            - __pycache__/
            - '*.pyc'
            - .venv/
            - .pytest_cache/
